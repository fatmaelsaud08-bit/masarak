*{box-sizing:border-box}

.hero .ghost{background:transparent;color:#fff;border-color:#fff}

.stat{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:center}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.step{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px}

.step b{display:block;margin:6px 0 4px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{margin:0;display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px}

ul{padding-inline-start:20px;margin:6px 0}

.chip{display:inline-block;width:auto;flex-shrink:0;white-space:nowrap;margin:0;padding:8px 16px;border-radius:20px;font-size:14px;text-align:center}

.langrow{display:flex;gap:8px;margin:8px 0 12px}

.count{color:var(--mu);font-size:14px;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.course{margin:0;display:flex;flex-direction:column;justify-content:space-between}
.cico{height:92px;border-radius:12px;background:linear-gradient(135deg,#e8efff,#f1e9ff);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:12px}
.tag{display:inline-block;background:#eef3ff;color:var(--p);border-radius:20px;padding:2px 11px;font-size:12px;margin:0 0 8px;margin-inline-end:6px;font-weight:600}

.tag.free{background:#fff3dc;color:#9a6200}
.course h2{font-size:16px;line-height:1.6;margin:4px 0 6px}
a.link{display:block;text-align:center;background:var(--p);color:#fff;text-decoration:none;padding:11px;border-radius:10px;margin-top:10px;font-weight:600}

.fav.on{background:#fff3dc;border-color:#f0b429}
.course{position:relative}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.okc{background:#e7f7f1;border:1px solid #a8dcc8;color:#0f5f4a;border-radius:12px;padding:12px;margin:10px 0}

#botbtn{position:fixed;bottom:18px;inset-inline-start:18px;width:58px;height:58px;border-radius:50%;padding:0;margin:0;font-size:26px;text-align:center;z-index:30;background:var(--p);color:#fff;border:none;box-shadow:0 6px 20px rgba(37,99,235,.45)}

.bothead{background:var(--p);color:#fff;padding:12px 14px;font-weight:700}

.botin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}

    return true;
  });

function norm(s){
  return s.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[ًٌٍَُِّْ]/g,"");
}
function hasKw(t, w){
  w = norm(w);
  if(/^[a-z ]+$/.test(w)){
    return new RegExp("(^|[^a-z])" + w + "([^a-z]|$)").test(t);
  }
  return t.indexOf(w) !== -1;
}
function matchedFields(t){
  return Object.keys(KW).filter(function(k){
    return KW[k].some(function(w){ return hasKw(t, w); });
  });
}
function fieldAnswer(k){
  const list = trackCourses(k);
  let r = F[k].ic + " " + fname(k) + "\n" + tr("topSk") + " " + fskills(k).join("، ") + "\n" + tr("coursesAre") + "\n";
  r += list.slice(0,5).map(function(c){ return "- " + ctitle(c); }).join("\n");
  if(list.length > 5){ r += "\n" + tr("more"); }
  return r;
}
function brief(k){
  return "• " + fname(k) + ": " + fskills(k).slice(0,3).join("، ");
}
function botReply(text){
  const t = norm(text);
  const fs = matchedFields(t);
  if(fs.length >= 2){
    return tr("compare") + "\n" + fs.slice(0,3).map(brief).join("\n");
  }
  if(fs.length === 1){ return fieldAnswer(fs[0]); }
  if(/مرحبا|اهلا|سلام|هاي|hello|\bhi\b|hey/.test(t)){ return tr("hi"); }
  if(/شكرا|تسلم|thank/.test(t)){ return tr("thanks"); }
  if(/مجالات|المجالات|fields|tracks|available/.test(t)){
    return tr("fieldsList") + "\n" + Object.keys(F).map(function(k){ return "- " + fname(k); }).join("\n");
  }
  if(/اقترح|رشح|مناسب|ايه المجال|suggest|recommend|which field|what field/.test(t)){ return tr("suggestFlow"); }
  if(/شهاده|certificate|certif/.test(t)){ return tr("cert"); }
  if(/نصيحه|نصايح|tip|advice/.test(t)){
    const a = T[L].tips;
    return a[Math.floor(Math.random() * a.length)];
  }
  if(/كام مجال|كام كورس|how many/.test(t)){
    return tr("howMany",{f:Object.keys(F).length,c:COURSES.length});
  }
  if(/كورس|مجان|دورات|دوره|course|free|learn/.test(t)){
    const wantAr = /عربي|arabic/.test(t);
    const wantEn = /انجليزي|english/.test(t);
    let list = COURSES;
    if(wantAr && !wantEn){ list = COURSES.filter(function(c){ return c.l === "ar"; }); }

  }
  if(/اختبار|نتيجه|حساب|يحسب|توافق|quiz|score|result|work/.test(t)){ return tr("quizHow"); }
  if(/ابدا|بدايه|ازاي|اعمل ايه|start|begin|how do i/.test(t)){ return tr("howStart"); }
  return tr("fallback");
}
